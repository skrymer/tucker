# Production overlay (ADR 0015 — production deployment topology). Layer it on the
# dev base; nothing here is for local dev:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# It adds the frontend container (serves the SPA and same-origins /api -> backend
# at runtime), points the single Cloudflare tunnel ingress at the frontend, and
# stops publishing the backend's port on the host. The Cloudflare dashboard
# ingress (<host> -> http://frontend:3000) is a one-time operator step, not
# expressible here (token tunnel) — see deploy/README.md.
#
# Both images come from GHCR, built by CI (ADR 0015). `build: !reset null` drops
# the base file's build stanza so that even a hand-run `up -d --build` cannot
# start building on the node: the box is a 1-vCPU/2 GB VPS and the Vite stage no
# longer fits in it. TUCKER_TAG is written into .env by deploy/update.sh; `:?`
# fails at compose-parse time rather than resolving to an empty tag, which Docker
# would read as `latest` and quietly deploy something other than what was asked
# for.
#
# Off-host backup (litestream) is ungated here so a bare `up -d` brings it up in
# prod (issue #89); it needs the LITESTREAM_* secrets in .env and the backend's
# database in WAL mode (enabled at startup by SqliteWalMode).
#
# Requires Docker Compose >= v2.24.4 for the `!reset` tag.
services:
  frontend:
    build: !reset null
    image: ghcr.io/skrymer/tucker-frontend:${TUCKER_TAG:?set by deploy/update.sh}
    container_name: tucker-frontend
    restart: unless-stopped
    environment:
      # Same-origin /api proxy target: the backend over the internal compose
      # network. Read at runtime by server/routes/api/[...].ts.
      TUCKER_API_UPSTREAM: http://backend:8080
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M         # light nitro node server — keep Tucker bounded

  backend:
    build: !reset null
    image: ghcr.io/skrymer/tucker-backend:${TUCKER_TAG:?set by deploy/update.sh}
    environment:
      # The real Access team, application and JWKS (deploy/README.md step 6), which
      # replace the dev base's non-production values key by key. `:?` makes a missing
      # one fail at compose-parse time — before any container exists — because the
      # alternative is inheriting a signing key anyone can read off GitHub. Getting
      # one of these *wrong* instead of absent 401s every request; recovery is
      # redeploying the previous image, and /api/version stays open to tell that
      # apart from the app being down (ADR 0020, Consequences).
      TUCKER_ACCESS_ISSUER: ${TUCKER_ACCESS_ISSUER:?set in .env — see deploy/README.md}
      TUCKER_ACCESS_AUDIENCE: ${TUCKER_ACCESS_AUDIENCE:?set in .env — see deploy/README.md}
      TUCKER_ACCESS_JWK_SET_URI: ${TUCKER_ACCESS_JWK_SET_URI:?set in .env — see deploy/README.md}
      # The email V9 attributes this database's existing rows to (issue #156). This is
      # the *only* deployment where it is ever written, because it is the only database
      # with history to adopt — and it has to be byte-for-byte the address Cloudflare
      # asserts. Wrong, and the next sign-in provisions a second User while every
      # Entry, Weight Measurement, Goal and Weekly Review stays owned by the first.
      TUCKER_OWNER_EMAIL: ${TUCKER_OWNER_EMAIL:?set in .env — see deploy/README.md}
    # In prod nothing binds 8080 on the host: only the frontend and the tunnel
    # reach the backend over the internal network. `!reset` clears the dev base's
    # 127.0.0.1:8080 publish (a plain list would merge/append, not replace).
    ports: !reset []

  cloudflared:
    # The tunnel is always wanted in prod, so clear the base `tunnel` profile —
    # a bare `up -d` brings it up. Its single ingress fronts the frontend, which
    # serves the SPA and proxies /api, so Cloudflare Access gates exactly one app.
    profiles: !reset []
    depends_on:
      - frontend

  litestream:
    # Off-host backup is always wanted in prod, so clear the base `backup` profile
    # — a bare `up -d` brings it up (issue #89). It replicates the backend's WAL to
    # the LITESTREAM_* S3 target (Cloudflare R2); the keys live in the host .env.
    profiles: !reset []
