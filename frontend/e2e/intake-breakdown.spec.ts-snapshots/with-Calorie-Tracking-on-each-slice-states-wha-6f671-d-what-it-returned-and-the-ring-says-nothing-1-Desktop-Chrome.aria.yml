        - group "Period":
            - tablist:
                - tab "Today" [selected]
                - tab "Last 7 days"
        - list:
            - listitem: Chicken breast 520 kcal · 97 g protein 26%
            - listitem: Work canteen est. 480 kcal 24%
            - listitem: Basmati rice 350 kcal · 8 g protein 18%
            - listitem: Cottage pie 240 kcal · 22 g protein 12%
            - listitem: Skyr 120 kcal · 20 g protein 6%
            - listitem: Banana 105 kcal · 1 g protein 5%
            - listitem: Olive oil 90 kcal · 0 g protein 5%
            - listitem: Almonds 60 kcal · 2 g protein 3%
            - listitem:
                - text: Other 2 items 35 kcal · 0 g protein 2%
                - button "Show all 2"
    - region "Vitamins and minerals":
        - heading "Vitamins and minerals" [level=2]
        - paragraph: Nothing logged in the last 7 days.
        - paragraph:
            - text: Based on the Australian Food Composition Database (Release 3), Food Standards Australia New Zealand, used under
            - link "the CC BY-SA 3.0 AU data user licence":
                - /url: https://www.foodstandards.gov.au/science-data/monitoringnutrients/afcd/datauserlicenceagreement
            - text: .
        - button "About this data"
        - paragraph:
            - text: Reference intakes from the Nutrient Reference Values for Australia and New Zealand (NHMRC, 2006, sodium revised 2017), used under
            - link "CC BY 4.0":
                - /url: https://creativecommons.org/licenses/by/4.0/
            - text: '. Source: National Health and Medical Research Council. They are the figures for an adult who is not pregnant and not breastfeeding — both shift several of them substantially, and Tucker has no setting for either.'
    - table "Weekly reviews, newest first. Deltas compare each review with the previous one.":
        - caption: Weekly reviews, newest first. Deltas compare each review with the previous one.
        - rowgroup:
            - row "Reviewed Basis Budget Trend wt. Maintenance Protein floor":
                - columnheader "Reviewed"
                - columnheader "Basis"
                - columnheader "Budget"
                - columnheader "Trend wt."
                - columnheader "Maintenance"
                - columnheader "Protein floor"
            - row
        - rowgroup:
            - row "1 Jun 2026 Adaptive 1900 86.0 2400 170":
                - cell "1 Jun 2026"
                - cell "Adaptive"
                - cell "1900"
                - cell "86.0"
                - cell "2400"
