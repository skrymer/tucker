- main:
    - heading "Review" [level=1]
    - button "Run review now"
    - region "What you're eating":
        - heading "What you're eating" [level=2]
        - text: /\d+ kcal/
        - group "Period":
            - tablist:
                - tab "Today" [selected]
                - tab "Last 7 days"
        - list:
            - listitem:
                - paragraph: Chicken breast
                - paragraph: /\d+ kcal · \d+ g protein/
                - text: /\d+%/
            - listitem:
                - paragraph: Work canteen est.
                - paragraph: /\d+ kcal/
                - text: /\d+%/
            - listitem:
                - paragraph: Basmati rice
                - paragraph: /\d+ kcal · 8 g protein/
                - text: /\d+%/
            - listitem:
                - paragraph: Cottage pie
                - paragraph: /\d+ kcal · \d+ g protein/
                - text: /\d+%/
            - listitem:
                - paragraph: Skyr
                - paragraph: /\d+ kcal · \d+ g protein/
                - text: 6%
            - listitem:
                - paragraph: Banana
                - paragraph: /\d+ kcal · 1 g protein/
                - text: 5%
            - listitem:
                - paragraph: Olive oil
                - paragraph: /\d+ kcal · 0 g protein/
                - text: 5%
            - listitem:
                - paragraph: Almonds
                - paragraph: /\d+ kcal · 2 g protein/
                - text: 3%
            - listitem:
                - paragraph: Other 2 items
                - paragraph: /\d+ kcal · 0 g protein/
                - text: 2%
                - button "Show all 2"
    - table "Weekly reviews, newest first. Deltas compare each review with the previous one.":
        - caption: Weekly reviews, newest first. Deltas compare each review with the previous one.
        - rowgroup:
            - row "Reviewed Basis Budget Trend wt. Maintenance Protein floor":
                - columnheader "Reviewed"
                - columnheader "Basis"
                - columnheader "Budget"
                - columnheader "Trend wt."
                - columnheader "Maintenance"
                - columnheader "Protein floor"
            - row
        - rowgroup:
            - row /1 Jun \d+ Adaptive \d+ \d+\.\d+ \d+ \d+/:
                - cell /1 Jun \d+/
                - cell "Adaptive"
                - cell /\d+/
                - cell /\d+\.\d+/
                - cell /\d+/
                - cell /\d+/
