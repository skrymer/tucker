- region "What you're eating":
    - heading "What you're eating" [level=2]
    - text: /\d+ kcal/
    - group "Period":
        - tablist:
            - tab "Today" [selected]
            - tab "Last 7 days"
    - list:
        - listitem: /Chicken breast \d+ kcal · \d+ g protein \d+%/
        - listitem: /Work canteen est\. \d+ kcal \d+%/
        - listitem: /Basmati rice \d+ kcal · 8 g protein \d+%/
        - listitem: /Cottage pie \d+ kcal · \d+ g protein \d+%/
        - listitem: /Skyr \d+ kcal · \d+ g protein 6%/
        - listitem: /Banana \d+ kcal · 1 g protein 5%/
        - listitem: /Olive oil \d+ kcal · 0 g protein 5%/
        - listitem: /Almonds \d+ kcal · 2 g protein 3%/
        - listitem:
            - text: /Other 2 items \d+ kcal · 0 g protein 2%/
            - button "Show less" [expanded]
        - listitem: /Blueberries \d+ kcal · 0 g protein 1%/
        - listitem: /Black coffee \d+ kcal · 0 g protein 1%/
