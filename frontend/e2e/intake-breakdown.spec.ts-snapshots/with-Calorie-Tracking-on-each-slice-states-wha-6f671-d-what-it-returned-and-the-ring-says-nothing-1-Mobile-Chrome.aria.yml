- main:
    - heading "Review" [level=1]
    - region "What you're eating":
        - heading "What you're eating" [level=2]
        - text: /\d+ kcal/
        - group "Period":
            - tablist:
                - tab "Today" [selected]
                - tab "Last 7 days"
        - list:
            - listitem: /Chicken breast \d+ kcal · \d+ g protein \d+%/
            - listitem: /Work canteen est\. \d+ kcal \d+%/
            - listitem: /Basmati rice \d+ kcal · 8 g protein \d+%/
            - listitem: /Cottage pie \d+ kcal · \d+ g protein \d+%/
            - listitem: /Skyr \d+ kcal · \d+ g protein 6%/
            - listitem: /Banana \d+ kcal · 1 g protein 5%/
            - listitem: /Olive oil \d+ kcal · 0 g protein 5%/
            - listitem: /Almonds \d+ kcal · 2 g protein 3%/
            - listitem:
                - text: /Other 2 items \d+ kcal · 0 g protein 2%/
                - button "Show all 2"
    - region "Vitamins and minerals":
        - heading "Vitamins and minerals" [level=2]
        - paragraph: Nothing logged in the last 7 days.
        - paragraph:
            - text: Based on the Australian Food Composition Database (Release 3), Food Standards Australia New Zealand, used under
            - link "the CC BY-SA 3.0 AU data user licence":
                - /url: https://www.foodstandards.gov.au/science-data/monitoringnutrients/afcd/datauserlicenceagreement
            - text: .
        - button "About this data"
        - paragraph:
            - text: /Reference intakes from the Nutrient Reference Values for Australia and New Zealand \(NHMRC, \d+, sodium revised \d+\), used under/
            - link "CC BY 4.0":
                - /url: https://creativecommons.org/licenses/by/4.0/
            - text: '. Source: National Health and Medical Research Council. They are the figures for an adult who is not pregnant and not breastfeeding — both shift several of them substantially, and Tucker has no setting for either.'
    - list:
        - listitem:
            - paragraph: /1 Jun \d+/
            - text: Adaptive
            - paragraph: /\d+/
            - paragraph: kcal budget
            - paragraph: /\d+\.\d+ kg trend · \d+ kcal maint · \d+ g protein/
    - button "Run review now"
