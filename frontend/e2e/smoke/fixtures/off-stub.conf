# The Open Food Facts stub's responder, mounted over nginx's default server.
#
# Plain static serving out of the fixtures directory — a recorded barcode
# resolves, one with no file 404s — plus the reserved barcode below, which the
# stub refuses so a smoke can drive a real Inconclusive Lookup (issue #164).
# The rationale, and the rule about keeping this value unique, are in
# off-stub/README.md.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Reserved, never a real product. Kept in step with the smokes and the README.
    location = /api/v2/product/5030000000503.json {
        return 503;
    }

    location / {
        try_files $uri =404;
    }
}
