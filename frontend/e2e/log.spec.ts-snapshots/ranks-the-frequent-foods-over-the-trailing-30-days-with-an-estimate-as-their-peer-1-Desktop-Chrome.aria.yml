                - button "Log Rolled oats": /Rolled oats \d+ kcal · \d+ g protein \/100g/
            - listitem:
                - button "Log Weekday chilli, a recipe": /Weekday chilli \d+ kcal · \d+ g protein \/100g/
    - region "All foods":
        - heading "All foods" [level=2]
        - list:
            - listitem:
                - button "Log Free-range eggs": /Free-range eggs \d+ kcal · \d+ g protein \/100g/
            - listitem:
                - button "Log Rolled oats": /Rolled oats \d+ kcal · \d+ g protein \/100g/
            - listitem:
                - button "Log Weekday chilli, a recipe": /Weekday chilli Recipe \d+ kcal · \d+ g protein \/100g/
