org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# Bound the daemon's heap. Unset, Gradle sizes it from physical RAM, and the
# daemon then sits at ~1 GB between builds — which matters because systemd-oomd
# watches the whole user slice, not any one process: a mutation sweep is killed
# by what is *also* resident, not by its own footprint alone. See the memory
# budget in the mutation-test skill.
# MaxMetaspaceSize is restated because this property REPLACES Gradle's defaults;
# dropping it would leave a long-lived daemon's metaspace unbounded, which is the
# opposite of the point.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=384m
