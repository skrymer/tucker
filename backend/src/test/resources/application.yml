spring:
  # Actuator's allowlist, the same file main imports (ADR 0039).
  config:
    import: classpath:management.yml
  # V9 names the owner of a pre-multi-user database. This file shadows main
  # entirely, so it has to be stated here or every @SpringBootTest context fails.
  # Deliberately *not* AccessTokens.EMAIL: a test database starts empty, so V9
  # adopts nothing and no owner row is written — and if that ever stopped being
  # true, a distinct address makes the phantom owner obvious instead of letting
  # it quietly alias the identity every test authenticates as.
  flyway:
    placeholders:
      ownerEmail: owner@tucker.invalid
  datasource:
    url: jdbc:sqlite:build/test-tucker.db   # throwaway DB; wiped by `./gradlew clean`
    hikari:
      # Enforce referential integrity as production does (main application.yml) —
      # this test config otherwise shadows main entirely, so without it FK rules
      # (e.g. recipe_ingredient's ON DELETE CASCADE) would silently not fire.
      connection-init-sql: PRAGMA foreign_keys = ON

# No background cron during tests — they drive ReminderScheduler.runTick and
# MetricRetention.prune explicitly, and a tick firing mid-test would contend for
# the single SQLite connection and mutate shared state.
tucker:
  scheduling:
    enabled: false

  # Verify against the committed non-production key (dev/access-key/), so the suite
  # runs through the real decoder rather than a bypass (ADR 0020). These three have
  # no defaults in main's application.yml — a backend given none refuses to start —
  # and this file shadows main entirely, so they have to be stated here or every
  # @SpringBootTest context fails. AccessTokens mints to match.
  access:
    issuer: https://access.tucker.invalid
    audience: tucker-dev
    jwk-set-uri: classpath:access/jwks.json

  # Where health measures disk space. /data is the image's volume and exists nowhere
  # else, and a missing path reads as no space, which would turn every test's health DOWN.
  data-dir: build

  # One Admin, never the suite's default identity, so every other test runs as a
  # plain User (ADR 0039).
  admin:
    emails: admin@tucker.invalid

# Main declares every response JSON for the spec; this file shadows main entirely,
# so the spec OpenApiSnapshotTest compares against would otherwise say `*/*`.
springdoc:
  default-produces-media-type: application/json

# @SpringBootTest switches every metrics exporter off by default, which would leave the
# prometheus endpoint unmapped and the suite unable to see what production serves.
management:
  prometheus:
    metrics:
      export:
        enabled: true
