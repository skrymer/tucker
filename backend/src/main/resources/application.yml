spring:
  application:
    name: tucker
  datasource:
    url: jdbc:sqlite:${TUCKER_DB_PATH:tucker.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1            # SQLite is single-writer; one connection avoids lock contention
      connection-init-sql: PRAGMA foreign_keys = ON
  jooq:
    sql-dialect: sqlite
  flyway:
    placeholders:
      # Who V9 attributes a pre-multi-user database to (issue #156). Deliberately
      # undefaulted, like tucker.access.* — Spring fails to resolve it and the app
      # refuses to start rather than seeding an owner nobody can authenticate as.
      # Name it wrong and the owner's next sign-in provisions a *second* User,
      # leaving their whole history owned by a row no assertion ever matches.
      # It is read from YAML rather than bound straight from the environment so
      # the placeholder key keeps its camel case (env vars cannot express that).
      ownerEmail: ${TUCKER_OWNER_EMAIL}

server:
  port: ${TUCKER_PORT:8080}
  # Behind the tunnel the backend is reached over plain HTTP, so the forwarded scheme is the
  # only thing that can tell it the client used https. That is what marks the CSRF cookie
  # `Secure` (ADR 0025); nothing else here reads the scheme. Off the tunnel it is inert — no
  # dev browser or test client sends the header, so `isSecure()` stays false and the cookie
  # stays sendable over http, which is what every suite depends on.
  forward-headers-strategy: FRAMEWORK

springdoc:
  swagger-ui:
    # Behind the Access gate since F10 slice 1, and so not browsable: a browser cannot
    # attach `Cf-Access-Jwt-Assertion` itself. ADR 0020 leaves exactly two paths open and
    # this is deliberately not one of them — the raw spec at /v3/api-docs is, which is what
    # `generateOpenApiDocs` and the typed client actually consume. Kept because the path
    # still governs where the UI mounts if it is ever opened up again.
    path: /docs
  writer-with-default-pretty-printer: true

# Build stamp (issue #117): baked into the image as env at build time
# (Dockerfile ARG -> ENV) and surfaced by GET /api/version. Defaults keep local
# `bootRun` and CI builds that set nothing reading as dev/unknown.
tucker:
  version: ${APP_VERSION:dev}
  git-sha: ${GIT_SHA:unknown}
  built-at: ${BUILT_AT:unknown}

  # Nutrition Providers are operator config, not code (ADR 0006). The default is
  # the live Open Food Facts host, so production is unchanged; the smoke stack
  # points it at a local stub so CI never depends on OFF's health (issue #163).
  # OpenFoodFactsProvider repeats this default inline on its @Value, because the
  # test application.yml shadows this file entirely.
  providers:
    open-food-facts:
      base-url: ${TUCKER_OFF_BASE_URL:https://world.openfoodfacts.org}
      # The per-attempt budget. Their sum plus the retry backoffs must stay inside
      # the client's 8s cap, so the server always reaches a verdict first and the
      # browser never invents one from silence (ADR 0007, issue #164). The provider
      # enforces that sum, so raising one of these costs retries, not overrun.
      connect-timeout: ${TUCKER_OFF_CONNECT_TIMEOUT:2s}
      read-timeout: ${TUCKER_OFF_READ_TIMEOUT:4s}
